services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - microhydros-network

  telemetry-service:
    build:
      context: .
      dockerfile: docker/telemetry-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file:
      - .env
    networks:
      - microhydros-network

  node-red:
    image: nodered/node-red:5.0.7
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Stockholm
    volumes:
      - node-red-data:/data
    networks:
      - microhydros-network

volumes:
  mosquitto-data:
  node-red-data:

networks:
  microhydros-network:
    driver: bridge
